<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} — {% endif %}Red Proyectar Futuro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;900&family=Source+Serif+4:ital,wght@0,300;0,400;0,600;1,400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --naranja:       #F47920;
      --azul:          #1F5AA8;
      --verde:         #2E7D32;
      --naranja-claro: #FEF0E3;
      --azul-claro:    #E8F0FB;
      --verde-claro:   #E8F5E9;
      --gris:          #5a5a5a;
      --gris-claro:    #e4e4e4;
      --negro:         #111111;
      --blanco:        #ffffff;
      --fondo:         #f9f9f7;
    }
    html { font-size: 18px; }
    body { font-family: 'Source Serif 4', Georgia, serif; background: var(--fondo); color: var(--negro); line-height: 1.7; }
    header { background: var(--blanco); border-bottom: 3px solid var(--naranja); position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 12px rgba(0,0,0,0.06); }
    .header-inner { max-width: 1100px; margin: 0 auto; padding: 0 2rem; display: flex; align-items: center; justify-content: space-between; height: 70px; }
    .logo { display: flex; align-items: center; gap: 0.75rem; text-decoration: none; }
    .logo img { height: 48px; width: auto; }
    .logo-texto { font-family: 'Montserrat', sans-serif; font-weight: 900; font-size: 0.9rem; line-height: 1.2; }
    .logo-texto .l1 { color: var(--naranja); }
    .logo-texto .l2 { color: var(--azul); }
    .logo-texto .l3 { color: var(--verde); }
    nav a { color: var(--gris); text-decoration: none; font-size: 0.8rem; font-family: 'Montserrat', sans-serif; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; padding: 0.4rem 0.9rem; transition: all 0.2s; }
    nav a:hover { color: var(--azul); background: var(--azul-claro); }
    main { max-width: 1100px; margin: 0 auto; padding: 3rem 2rem 6rem; min-height: calc(100vh - 140px); }
    footer { background: var(--negro); color: #aaa; padding: 2.5rem 2rem; }
    .footer-inner { max-width: 1100px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 1rem; }
    .footer-logo { font-family: 'Montserrat', sans-serif; font-weight: 900; font-size: 0.9rem; line-height: 1.3; }
    .footer-logo .l1 { color: var(--naranja); }
    .footer-logo .l2 { color: #5b8fd4; }
    .footer-logo .l3 { color: #6abf6e; }
    .footer-copy { font-size: 0.78rem; font-weight: 300; }
    @media (max-width: 600px) {
      html { font-size: 16px; }
      .header-inner { padding: 0 1rem; height: 60px; }
      .logo img { height: 38px; }
      .logo-texto { display: none; }
      nav a { padding: 0.4rem 0.6rem; font-size: 0.75rem; }
      main { padding: 2rem 1rem 4rem; }
      .footer-inner { flex-direction: column; text-align: center; }
    }
  </style>
</head>
<body>
<header>
  <div class="header-inner">
    <a href="{{ '/' | relative_url }}" class="logo">
      <img src="{{ '/LOGO-RED.png' | relative_url }}" alt="Red Proyectar Futuro">
      <div class="logo-texto">
        <div class="l1">RED</div>
        <div class="l2">PROYECTAR</div>
        <div class="l3">FUTURO</div>
      </div>
    </a>
    <nav>
      <a href="{{ '/notas/' | relative_url }}">Notas</a>
      <a href="{{ '/documentos/' | relative_url }}">Documentos</a>
    </nav>
  </div>
</header>
<main>{{ content }}</main>
<footer>
  <div class="footer-inner">
    <div class="footer-logo">
      <div class="l1">RED</div>
      <div class="l2">PROYECTAR</div>
      <div class="l3">FUTURO</div>
    </div>
    <p class="footer-copy">Participación ciudadana y desarrollo local</p>
  </div>
</footer>
</body>
</html>
