---
layout: default
---

<article class="doc-articulo">
  <header class="doc-header">
    <div class="doc-meta-top">
      <span class="categoria">{{ page.categoria }}</span>
      <span class="tipo-badge">Documento PDF</span>
    </div>
    <h1 class="doc-titulo">{{ page.title }}</h1>
    {% if page.descripcion %}<p class="doc-descripcion">{{ page.descripcion }}</p>{% endif %}
  </header>
  {% if page.archivo %}
  <div class="doc-acciones">
    <a href="{{ page.archivo | relative_url }}" class="btn-descargar" target="_blank" download>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
        <polyline points="7 10 12 15 17 10"/>
        <line x1="12" y1="15" x2="12" y2="3"/>
      </svg>
      Descargar PDF
    </a>
    <a href="{{ page.archivo | relative_url }}" class="btn-ver" target="_blank">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
        <circle cx="12" cy="12" r="3"/>
      </svg>
      Ver en el navegador
    </a>
  </div>
  <div class="doc-preview">
    <iframe src="{{ page.archivo | relative_url }}" width="100%" height="700px" title="{{ page.title }}">
      <p>Tu navegador no puede mostrar el PDF. <a href="{{ page.archivo | relative_url }}">Descargalo acá</a>.</p>
    </iframe>
  </div>
  {% endif %}
  <footer class="doc-footer">
    <a href="{{ '/documentos/' | relative_url }}" class="volver">← Volver a todos los documentos</a>
  </footer>
</article>

<style>
  .doc-articulo { max-width: 860px; margin: 0 auto; }
  .doc-header { padding-bottom: 2rem; margin-bottom: 2rem; border-bottom: 1px solid var(--gris-claro); }
  .doc-meta-top { display: flex; align-items: center; gap: 1rem; margin-bottom: 1.2rem; }
  .categoria { background: var(--verde); color: var(--blanco); font-size: 0.68rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; padding: 0.3rem 0.8rem; font-family: 'Montserrat', sans-serif; }
  .tipo-badge { font-size: 0.72rem; color: var(--gris); letter-spacing: 0.08em; text-transform: uppercase; font-family: 'Montserrat', sans-serif; font-weight: 600; border: 1px solid var(--gris-claro); padding: 0.25rem 0.7rem; }
  .doc-titulo { font-family: 'Montserrat', sans-serif; font-size: 2.2rem; font-weight: 900; line-height: 1.2; letter-spacing: -0.02em; margin-bottom: 1rem; color: var(--negro); }
  .doc-descripcion { font-size: 1.05rem; color: var(--gris); font-style: italic; font-weight: 300; line-height: 1.6; }
  .doc-acciones { display: flex; gap: 1rem; margin-bottom: 2rem; flex-wrap: wrap; }
  .btn-descargar, .btn-ver { display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.75rem 1.5rem; font-size: 0.85rem; font-family: 'Montserrat', sans-serif; font-weight: 700; text-decoration: none; transition: all 0.2s; }
  .btn-descargar { background: var(--naranja); color: var(--blanco); }
  .btn-descargar:hover { background: #d4661a; }
  .btn-ver { background: transparent; color: var(--azul); border: 2px solid var(--azul); }
  .btn-ver:hover { background: var(--azul); color: var(--blanco); }
  .doc-preview { border: 1px solid var(--gris-claro); background: var(--blanco); margin-bottom: 2rem; }
  .doc-footer { padding-top: 2rem; border-top: 1px solid var(--gris-claro); }
  .volver { color: var(--gris); text-decoration: none; font-size: 0.8rem; letter-spacing: 0.08em; text-transform: uppercase; font-family: 'Montserrat', sans-serif; font-weight: 600; transition: color 0.2s; }
  .volver:hover { color: var(--verde); }
  @media (max-width: 600px) { .doc-titulo { font-size: 1.8rem; } .doc-preview iframe { height: 400px; } }
</style>
