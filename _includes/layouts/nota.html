---
layout: default
---
<article class="nota-articulo">
  <header class="nota-header">
    <div class="nota-meta-top">
      <span class="categoria">{{ categoria }}</span>
      <time>{{ date | fechaFormato }}</time>
    </div>
    <h1 class="nota-titulo">{{ title }}</h1>
    {% if resumen %}<p class="nota-resumen">{{ resumen }}</p>{% endif %}
    <div class="nota-autor">
      <span class="autor-linea"></span>
      <span>{{ autor }}</span>
    </div>
  </header>

  <div class="nota-cuerpo">
    {{ content | safe }}
  </div>

  <footer class="nota-footer">
    <a href="/notas/" class="volver">← Volver a todas las notas</a>

    <div class="compartir">
      <span class="compartir-label">Compartir nota</span>
      <div class="compartir-btns">

        <a class="compartir-btn whatsapp"
           href="https://wa.me/?text={{ title | urlencode }}%20{{ page.url | absoluteUrl(site.url) | urlencode }}"
           target="_blank"
           rel="noopener"
           aria-label="Compartir en WhatsApp">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/><path d="M12 0C5.373 0 0 5.373 0 12c0 2.107.549 4.09 1.51 5.814L.057 23.447a.5.5 0 0 0 .492.601l5.826-1.528A11.942 11.942 0 0 0 12 24c6.627 0 12-5.373 12-12S18.627 0 12 0zm0 21.882a9.87 9.87 0 0 1-5.031-1.378l-.36-.214-3.733.979.996-3.638-.234-.374A9.867 9.867 0 0 1 2.118 12C2.118 6.533 6.533 2.118 12 2.118S21.882 6.533 21.882 12 17.467 21.882 12 21.882z"/></svg>
          WhatsApp
        </a>

        <a class="compartir-btn twitter"
           href="https://twitter.com/intent/tweet?text={{ title | urlencode }}&url={{ page.url | absoluteUrl(site.url) | urlencode }}&via=RedProyectarFuturo"
           target="_blank"
           rel="noopener"
           aria-label="Compartir en X / Twitter">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
          X / Twitter
        </a>

        <a class="compartir-btn facebook"
           href="https://www.facebook.com/sharer/sharer.php?u={{ page.url | absoluteUrl(site.url) | urlencode }}"
           target="_blank"
           rel="noopener"
           aria-label="Compartir en Facebook">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
          Facebook
        </a>

      </div>
    </div>
  </footer>
</article>

<style>
  .nota-articulo { max-width: 720px; margin: 0 auto; }
  .nota-header { padding-bottom: 2.5rem; margin-bottom: 2.5rem; border-bottom: 1px solid var(--gris-claro); background: transparent; }
  .nota-meta-top { display: flex; align-items: center; gap: 1.5rem; margin-bottom: 1.5rem; }
  .categoria { background: var(--azul); color: var(--blanco); font-size: 0.68rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; padding: 0.3rem 0.8rem; font-family: 'Montserrat', sans-serif; }
  .nota-meta-top time { font-size: 0.85rem; color: var(--gris); font-weight: 300; }
  .nota-titulo { font-family: 'Montserrat', sans-serif; font-size: 2.5rem; font-weight: 900; line-height: 1.15; letter-spacing: -0.02em; margin-bottom: 1.2rem; color: var(--negro); }
  .nota-resumen { font-size: 1.1rem; color: var(--gris); font-style: italic; font-weight: 300; line-height: 1.6; margin-bottom: 1.5rem; }
  .nota-autor { display: flex; align-items: center; gap: 1rem; font-size: 0.9rem; font-weight: 700; font-family: 'Montserrat', sans-serif; color: var(--verde); }
  .autor-linea { display: inline-block; width: 32px; height: 3px; background: var(--naranja); }
  .nota-cuerpo { font-size: 1.05rem; line-height: 1.85; color: #1a1a1a; }
  .nota-cuerpo p { margin-bottom: 1.4rem; }
  .nota-cuerpo h2 { font-family: 'Montserrat', sans-serif; font-size: 1.5rem; font-weight: 700; margin: 2.5rem 0 1rem; color: var(--azul); }
  .nota-cuerpo h3 { font-family: 'Montserrat', sans-serif; font-size: 1.2rem; font-weight: 700; margin: 2rem 0 0.8rem; color: var(--verde); }
  .nota-cuerpo blockquote { border-left: 4px solid var(--naranja); padding: 0.5rem 0 0.5rem 1.5rem; margin: 2rem 0; font-style: italic; color: var(--gris); background: var(--naranja-claro); }
  .nota-cuerpo a { color: var(--azul); text-decoration: underline; text-underline-offset: 3px; }
  .nota-cuerpo img { max-width: 100%; height: auto; margin: 1.5rem 0; }

  /* ── FOOTER ── */
  .nota-footer {
    margin-top: 4rem;
    padding-top: 2rem;
    border-top: 1px solid var(--gris-claro);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 1.5rem;
  }

  .volver { color: var(--gris); text-decoration: none; font-size: 0.8rem; letter-spacing: 0.08em; text-transform: uppercase; font-family: 'Montserrat', sans-serif; font-weight: 600; transition: color 0.2s; }
  .volver:hover { color: var(--azul); }

  /* ── COMPARTIR ── */
  .compartir {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    flex-wrap: wrap;
  }

  .compartir-label {
    font-size: 0.72rem;
    font-family: 'Montserrat', sans-serif;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--gris);
  }

  .compartir-btns {
    display: flex;
    gap: 0.5rem;
  }

  .compartir-btn {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    padding: 0.4rem 0.9rem;
    border-radius: 2px;
    font-size: 0.72rem;
    font-family: 'Montserrat', sans-serif;
    font-weight: 700;
    letter-spacing: 0.05em;
    text-decoration: none;
    transition: opacity 0.2s, transform 0.15s;
  }

  .compartir-btn:hover { opacity: 0.85; transform: translateY(-1px); }

  .compartir-btn svg { width: 14px; height: 14px; flex-shrink: 0; }

  .compartir-btn.whatsapp  { background: #25D366; color: #fff; }
  .compartir-btn.twitter   { background: #000;    color: #fff; }
  .compartir-btn.facebook  { background: #1877F2; color: #fff; }

  @media (max-width: 600px) {
    .nota-titulo { font-size: 1.8rem; }
    .nota-footer { flex-direction: column; align-items: flex-start; }
    .compartir { flex-direction: column; align-items: flex-start; }
  }
</style>
