backend:
  name: github
  repo: redproyectarfuturo-web/redproyectarfuturo
  branch: main

media_folder: "imagenes"
public_folder: "/imagenes"

locale: 'es'

collections:
  - name: "notas"
    label: "Notas de opinión"
    folder: "_notas"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Autor/a", name: "autor", widget: "string" }
      - { label: "Fecha", name: "date", widget: "datetime" }
      - label: "Categoría"
        name: "categoria"
        widget: "select"
        options: ["Educación", "Tecnología", "Desarrollo local", "Institucional"]
      - { label: "Resumen", name: "resumen", widget: "text" }
      - { label: "Contenido", name: "body", widget: "markdown" }

  - name: "documentos"
    label: "Documentos PDF"
    folder: "_documentos"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Descripción", name: "descripcion", widget: "text" }
      - label: "Categoría"
        name: "categoria"
        widget: "select"
        options: ["Desarrollo local", "Educación cívica", "Tecnología", "Institucional"]
      - label: "Archivo PDF"
        name: "archivo"
        widget: "file"
        media_library:
          config:
            multiple: false
