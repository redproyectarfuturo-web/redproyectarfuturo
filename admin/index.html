<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panel — Red Proyectar Futuro</title>
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script>
    var defined = window.CMS;
    if (defined) {
      CMS.init({
        config: {
          backend: {
            name: "git-gateway",
            branch: "main"
          },
          media_folder: "imagenes",
          locale: "es",
          collections: [
            {
              name: "notas",
              label: "Notas de opinión",
              folder: "_notas",
              create: true,
              slug: "{{slug}}",
              fields: [
                { label: "Título", name: "title", widget: "string" },
                { label: "Autor/a", name: "autor", widget: "string" },
                { label: "Fecha", name: "date", widget: "datetime" },
                { label: "Categoría", name: "categoria", widget: "select", options: ["Educación", "Tecnología", "Desarrollo local", "Institucional"] },
                { label: "Resumen", name: "resumen", widget: "text" },
                { label: "Contenido", name: "body", widget: "markdown" }
              ]
            },
            {
              name: "documentos",
              label: "Documentos PDF",
              folder: "_documentos",
              create: true,
              fields: [
                { label: "Título", name: "title", widget: "string" },
                { label: "Descripción", name: "descripcion", widget: "text" },
                { label: "Categoría", name: "categoria", widget: "select", options: ["Desarrollo local", "Educación cívica", "Tecnología", "Institucional"] },
                { label: "Archivo PDF", name: "archivo", widget: "file" }
              ]
            }
          ]
        }
      });
    }
  </script>
</body>
</html>
